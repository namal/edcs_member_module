[tool.black]
line-length = 88
target-version = ["py312"]

[tool.djlint]
profile = "django"
# Match directory boundaries so district_list.html is included.
exclude = '(^|/)(\.venv|venv|node_modules|\.git|dist|build)(/|$)'
indent = 2
max_line_length = 120
preserve_blank_lines = true
blank_line_after_tag = "load,extends"
format_attribute_template_tags = false
single_attribute_per_line = true

