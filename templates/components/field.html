<div class="form-field {% if wide %}sm:col-span-2{% endif %}{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}" class="field-label">
    {{ field.label }}
    {% if field.field.required %}
      <span class="field-requirement">* Required</span>
    {% elif field.field.disabled %}
      <span class="field-requirement">(automatic)</span>
    {% else %}
      <span class="field-requirement">(optional)</span>
    {% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}<p class="field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}
    <div id="{{ field.auto_id }}_error" role="alert">
      {% for error in field.errors %}
        <p class="field-error">
          <strong>Error:</strong> {{ error }}
        </p>
      {% endfor %}
    </div>
  {% endif %}
</div>
