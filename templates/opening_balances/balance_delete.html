{% extends 'base.html' %}

{% block content %}
  <section class="card mx-auto my-10 max-w-lg p-8">
    <h1 class="section-title">Delete these opening balances?</h1>
    <p class="muted mt-4">{{ balance.member.member_no }} · {{ balance.member.full_name }}</p>
    <p class="muted mt-3">
      This removes the opening balance record and all of its amounts. The member and their payment plan remain saved.
    </p>
    <form method="post" class="mt-6 flex justify-end gap-3">
      {% csrf_token %}
      <a class="btn btn-secondary"
         href="{% if perms.members.view_openingbalance %}{% url 'opening_balance_detail' balance.pk %}{% else %}{% url 'dashboard' %}{% endif %}">Cancel</a>
      <button class="btn btn-danger">Delete opening balances</button>
    </form>
  </section>
{% endblock %}
