{% extends 'base.html' %}

{% block content %}
  <section class="card mx-auto max-w-xl p-8 text-center">
    <span class="empty-icon mx-auto">
      <svg class="icon h-6 w-6">
        <use href="#i-lock" />
      </svg>
    </span>
    <p class="eyebrow mb-3">403 · Access restricted</p>
    <h1 class="page-title">
      This action needs permission<span class="text-brand-600">.</span>
    </h1>
    <p class="muted mt-4">
      Your account cannot access this page or perform this action. Contact your administrator if you need additional access.
    </p>
    <a href="{% url 'dashboard' %}" class="btn btn-primary mt-6">Back to my workspace</a>
  </section>
{% endblock %}
